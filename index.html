<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貸款試算APP V0.1</title>
    <style>
        * {
            font-family: Impact, "Microsoft JhengHei", "Heiti TC", "微軟正黑體", sans-serif;
            line-height: 1.4;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Impact, "Microsoft JhengHei", "Heiti TC", "微軟正黑體", sans-serif;
            background-color: #0D1117;
            padding: 24px;
            color: #F2C94C;
            text-align: center;
            background-image:
                linear-gradient(rgba(45, 226, 226, 0.05) 1px, transparent 10px),
                linear-gradient(90deg, rgba(45, 226, 226, 0.05) 1px, transparent 10px);
            background-size: 30px 30px;
            color: #ffffff;

        }

        h1,
        h2 {
            font-family: Impact, "Microsoft JhengHei", sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.6rem;
            color: #961212;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(150, 18, 18, 0.3);

            margin-bottom: 1rem;

        }

        h2 {
            color: #961212;
            font-size: 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .loan-form,
        .result {
            background: rgba(150, 18, 18, 0.75) !important;
            backdrop-filter: blur(8px);
            border: 5px solid rgba(242, 201, 76, 0.4);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(242, 201, 76, 0.1);
            border-radius: 4px;
            text-align: left;
            margin-bottom: 24px;
            padding: 24px;
        }

        .form-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-row label {
            width: 90px;
            font-weight: bold;
            color: #F2C94C;
        }

        input[type="number"],
        select {
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid #2de2e2 !important;
            color: #2de2e2 !important;
            padding: 8px 12px;
            box-shadow: inset 0 0 8px rgba(45, 226, 226, 0.3);
            text-shadow: 0 0 5px rgba(45, 226, 226, 0.5);
            border-radius: 6px;
            font-size: 1rem;
            width: 180px;
        }

        #clacBtn {
            padding: 12px;
            width: 100%;
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 6px;
            border: 1px solid #F2C94C;
            background-color: #961212;
            color: #F2C94C;
            cursor: pointer;
            letter-spacing: 2px;
            /* 過度動畫搭配 */
            transition: backguand-color 0.2s;
        }

        #clacBtn:hover {
            background: #f2c94c !important;
            color: #961212 !important;
            box-shadow: 0 0 25px #f2c94c;
        }

        input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #F2C94C;
        }

        .summary-table,
        .detail-table {
            width: 100%;
            border: none !important;
            border-collapse: collapse;
            margin-bottom: 24px;
        }

        .summary-table tr,
        .detail-table tr {
            border-bottom: 1px solid rgba(242, 201, 76, 0.15) !important;
        }

        .summary-table th,
        .detail-table th {
            background-color: rgba(242, 201, 76, 0.8);
            color: #ffffff;
            padding: 12px;
            text-align: left;
        }

        /* 數據發光效果 */
        #monthlyPayment,
        #totalPayment,
        #totalInterest,
        #scheduleBody td {
            color: #2de2e2 !important;
            text-shadow: 0 0 10px rgba(45, 226, 226, 0.8);
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            padding: 10px;
        }

        .detail-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #e5f6ff;
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse;
            border: none !important;
            background-color: transparent !important;
        }

        .detail-table tr:nth-child(even) {
            background-color: rgba(0, 0, 0, 0.2) !important;

        }

        .detail-table td,
        .summary-table td {
            background-color: transparent !important;
            /* 確保儲存格本身是透明的 */
            border: none !important;
            /* 徹底移除白框 */
            border-bottom: 5px solid rgba(242, 201, 76, 0.15) !important;
            /* 只留金色細底線 */
            padding: 12px 10px;
        }

        /* 4. 數據顏色與發光（針對明細表格主體） */
        #scheduleBody td {
            color: #2de2e2 !important;
            text-shadow: 0 0 8px rgba(45, 226, 226, 0.6);
        }

        .summary-table th {
            background-color: #F2C94C;
            color: #ffffff;

        }

        .summary-table th,
        .summary-table td {
            border: 1px solid #ffffff;
            padding: 10px 12px;
            text-align: left;

        }

        .subtitle {
            font-size: 0.9rem;
            color: #F2C94C;
            font-weight: 400;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>貸款精算助手
            <span class="subtitle">輸入條件,快速分析您的還款計畫</span>
        </h1>
        <form id="loanForm" action="" class="loan-form">
            <div class="form-row">
                <label for="amount">貸款金額</label>
                <input type="number" id="amount" name="amount" value="100" step="10" min="10" required> 萬
            </div>
            <div class="form-row">
                <label for="rate">貸款利率</label>
                <input type="number" id="rate" name="rate" value="1.85" step="0.01" min="1"> %
            </div>
            <!--<div class="form-row">
                 新增手續費用欄位  handlingFree
                <label for="handlingFree">貸款手續費</label>
                <input type="number" id="handlingFree" name="handlingFree" placeholder="請輸入相關手續費" required> 元
               
            </div>-->
            <div class="form-row">
                <label for="loanYears">貸款年限</label>
                <select name="loanYears" id="loanYears">
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="7" selected>7</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                </select> 年
            </div>
            <div class="form-row">
                <label for="repayment">還款方式</label>
                <input type="radio" id="repayment1" name="repayment" value="repaymentMethod1" checked>本金平均攤還
                <input type="radio" id="repayment2" name="repayment" value="repaymentMethod2">本息平均攤還
            </div>
            <!--後端才需要submit-->
            <button type="button" id="clacBtn">計算</button>
        </form>
        <h2>試算結果</h2>
        <div class="result">
            <div>
                <!-- 摘要表格 -->
                <table border="1" class="summary-table">
                    <thead>
                        <tr>
                            <th>項目</th>
                            <th>金額</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>每月還款金額</td>
                            <td id="monthlyPayment"></td>
                        </tr>
                        <tr>
                            <td>總還款金額</td>
                            <td id="totalPayment"></td>
                        </tr>
                        <tr>
                            <td>總利息支出</td>
                            <td id="totalInterest"></td>
                        </tr>
                    </tbody>
                </table>

                <!-- 分期明細表格 -->
                <table border="1" class="detail-table">
                    <thead>
                        <tr>
                            <th>期數</th>
                            <th>月付金額</th>
                            <th>本金</th>
                            <th>利息</th>
                            <th>剩餘本金</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">

                    </tbody>
                </table>
            </div>
        </div>
        <script>
            const title = document.querySelector("h1")
            console.log(title);
            //title.style.color = "green"
            //修改內容1.只改文字
            title.innerText = "AI貸款精算助手";
            //修改內容2.含標籤語法
            //title.innerHTML = "<b style='background-color:yellow'>AI貸款精算助手!</b>";

            const amountEl = document.querySelector("#amount");
            const rateEl = document.querySelector("#rate");
            const loanYearsEl = document.querySelector("#loanYears");
            const clacBtnEl = document.querySelector("#clacBtn");
            console.log(amountEl, rateEl, loanYearsEl, clacBtnEl);
            clacBtn.addEventListener("click", function (e) {
                let amount = amountEl.value;
                let rate = rateEl.value;
                let loanYears = loanYearsEl.value;
                //多個radio用name的取值方式
                let method = document.querySelector(
                    "input[name='repayment']:checked"
                ).value;

                console.log(amount, rate, loanYears, method);
                let schedules = repaymentMethod1(amount * 10000, rate, loanYears);
                renderTable(schedules);
            });
            //繪製table
            function renderTable(schedules) {
                let tableHtml = "";
                let totalPrincipalSum = 0; // 用於加總總還款金額
                let totalInterestSum = 0;  // 用於加總總利息
                for (let i = 0; i < schedules.length; i++) {
                    // 累加每一期的數據
                    totalPrincipalSum += schedules[i].monthlyPayment;
                    totalInterestSum += schedules[i].interest;
                    tableHtml += `
                    <tr>
                        <td>${schedules[i].month}</td>
                        <td>${schedules[i].monthlyPayment + schedules[i].interest}</td>
                        <td>${schedules[i].monthlyPayment}</td>
                        <td>${schedules[i].interest}</td>
                        <td>${schedules[i].amount}</td>
                    </tr>
                    `;
                }
                console.log(tableHtml);
                document.querySelector("#scheduleBody").innerHTML = tableHtml;
                // 每月還款金額 (以第一期為準，或是您可以計算平均值)
                const firstMonthPayment = schedules[0].monthlyPayment + schedules[0].interest;
                document.querySelector("#monthlyPayment").innerText = firstMonthPayment.toLocaleString();

                // 總還款金額
                const totalPayment = totalPrincipalSum + totalInterestSum;
                document.querySelector("#totalPayment").innerText = totalPayment.toLocaleString();

                // 總利息支出
                document.querySelector("#totalInterest").innerText = totalInterestSum.toLocaleString();
            }

            //本金平均攤還
            function repaymentMethod1(amount, rate, years) {

                let monthRate = rate / 100 / 12; //月利率

                let months = years * 12;    //總期數

                let monthlyPayment = Math.round(amount / months);

                console.log(monthRate, months, monthlyPayment);

                schedules = [];

                for (let i = 0; i < months; i++) {

                    let interest = Math.round(amount * monthRate);

                    amount -= monthlyPayment;

                    //最後一期

                    if (i == months - 1) {

                        monthlyPayment += amount;

                        amount = 0;

                    }

                    console.log(`${i + 1} 本金:${monthlyPayment} 利息:${interest} 剩餘餘額:${amount}`);

                    schedules.push(

                        {
                            "month": i + 1,
                            "monthlyPayment": monthlyPayment,
                            "interest": interest,
                            "amount": amount
                        }
                    );
                }

                console.log(schedules);
                return schedules;

                document.querySelector("#scheduleBody").innerHTML = tableHtml;

            }
        </script>
</body>

</html>
